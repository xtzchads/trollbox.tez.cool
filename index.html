<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TezTrollBox — On-Chain Tezos Chat</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Monda:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <script src="js/octez.connect.min.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <div class="ambient-stars" aria-hidden="true"></div>

  <div class="app-shell">
    <!-- Original TezCool Header -->
    <header class="header">
      <div class="header-content">
        <nav class="nav-menu">
          <a href="https://tez.cool/" class="nav-item">HOME</a>
          <a href="https://up.tez.cool/" class="nav-item">TEZCALM</a>
          <a href="https://tez.cool/map" class="nav-item">CHADMAP</a>
          <a href="https://eye.tez.cool/" class="nav-item">THE EYE OF CHAD</a>
          <a href="https://stake.tez.cool/" class="nav-item">TEZSTAKE</a>
          <a href="https://trollbox.tez.cool/" class="nav-item active">TEZTROLLBOX</a>
          <a href="https://secret.tez.cool/" class="nav-item">TEZWHALES</a>
          <a href="https://chat.tez.cool/" class="nav-item">NFTCHAT</a>
        </nav>
      </div>
    </header>

    <!-- Main TrollBox Workspace -->
    <main class="trollbox-main">
      <!-- Chat Toolbar -->
      <div class="chat-toolbar">
        <div class="toolbar-left">
          <div class="live-indicator">
            <span class="live-dot"></span>
            <span>TezTrollBox • Mainnet Public Room</span>
          </div>
          <a class="contract-pill" href="https://tzkt.io/KT1Ek4Nxu4XpQykpGLwaNtUJSWKuVpXFUJoy" target="_blank" rel="noopener noreferrer" title="View Smart Contract on TzKT">
            <span>KT1Ek4N…FUJoy</span>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </a>
          <span class="stats-pill" id="msgCountStat">Loading…</span>
        </div>

        <div class="toolbar-right">
          <div class="wallet-badge" id="walletBadge">
            <img id="walletAvatar" src="" alt="" />
            <span id="walletAddressText"></span>
          </div>
          <button type="button" class="btn-wallet" id="walletBtn">Connect Wallet</button>
        </div>
      </div>

      <!-- Glass Chat Card -->
      <section class="chat-card">
        <div class="messages-viewport" id="messagesViewport">
          <div class="chat-state-box">
            <div class="spinner-ring-sm"></div>
            <div>Syncing on-chain messages from Tezos Mainnet…</div>
          </div>
        </div>

        <!-- Reply Context Banner -->
        <div class="reply-banner" id="replyBanner">
          <div class="reply-banner-info" id="replyBannerText"></div>
          <button type="button" class="btn-cancel-reply" id="cancelReplyBtn">Cancel ✕</button>
        </div>

        <!-- Pending Transaction Bar -->
        <div class="tx-status-bar" id="txStatusBar">
          <div class="tx-status-left">
            <div class="spinner-ring-sm" style="width:16px;height:16px;border-width:2px;"></div>
            <span id="txStatusText">Broadcasting transaction…</span>
          </div>
        </div>

        <!-- Composer Bar -->
        <div class="composer-bar">
          <!-- Emoji Popover -->
          <div class="picker-popover" id="emojiPopover">
            <div class="picker-header" id="emojiCats"></div>
            <div class="emoji-grid" id="emojiGrid"></div>
          </div>

          <!-- GIF Popover -->
          <div class="picker-popover" id="gifPopover">
            <div class="picker-header">
              <input type="text" class="gif-search-input" id="gifSearchInput" placeholder="Search GIFs…" />
            </div>
            <div class="gif-grid" id="gifGrid"></div>
          </div>

          <button type="button" class="tool-icon-btn" id="emojiBtn" title="Insert Emoji">😊</button>
          <button type="button" class="tool-icon-btn" id="gifBtn" title="Insert GIF">GIF</button>

          <div class="composer-input-wrap">
            <input
              type="text"
              id="messageInput"
              class="composer-input"
              maxlength="280"
              placeholder="Connect your Tezos wallet to chat on-chain…"
              disabled
            />
            <span class="char-counter" id="charCounter">0/280</span>
          </div>

          <button type="button" class="btn-send" id="sendBtn" disabled>
            <span>Send</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </section>
    </main>
  </div>

  <div class="toast-stack" id="toastStack"></div>
</body>
</html>
